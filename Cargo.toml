[package]
name = "openmouse"
version = "0.2.0"
edition = "2021"
description = "Open-source wireless mouse, keyboard and trackpad - control your PC from your phone over local WiFi"
license = "MIT"
repository = "https://github.com/neer2005/openmouse"

[[bin]]
name = "openmouse"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
image = "0.25"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
# Self-update via GitHub Releases (tray menu "Check for updates…").
# No progress-bar: the console is hidden, so download progress goes nowhere.
# native-tls (Schannel) instead of rustls: no C toolchain needed to build,
# and it uses the Windows certificate store.
self_update = { version = "1", default-features = false, features = ["github", "reqwest", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
# Small, fast-starting single binary
opt-level = "z"
lto = true
codegen-units = 1
