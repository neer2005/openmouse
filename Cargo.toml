[package]
name = "openmouse"
version = "0.1.0"
edition = "2021"
description = "Open-source wireless mouse, keyboard and trackpad - control your PC from your phone over local WiFi"
license = "MIT"
repository = "https://github.com/neer2005/openmouse"

[[bin]]
name = "openmouse"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
image = "0.25"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_Foundation",
] }

[profile.release]
# Small, fast-starting single binary
opt-level = "z"
lto = true
codegen-units = 1
