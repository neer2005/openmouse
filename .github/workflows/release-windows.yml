name: Windows release build

# Builds openmouse.exe and publishes it to GitHub Releases.
#
# - Push/merge to main -> rolling "latest" prerelease (always fresh)
# - Push a v* tag      -> versioned release (e.g. v0.1.1)
# - Manual dispatch    -> optional tag input for a versioned release,
#                         otherwise a rolling "latest" build
#
# Publish logic lives in scripts/publish-release.ps1 (a normal repo file).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag for a proper release (e.g. v0.1.1). Leave empty for a rolling 'latest' build."
        required: false

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build openmouse.exe
        run: cargo build --release

      - name: Publish to GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: ./scripts/publish-release.ps1
